# =================================================================
# E-License — Production Deploy
#
# Setup (run once on the server):
#   cp .env.deploy.example .env.deploy
#   nano .env.deploy          # fill in SERVER_HOST, passwords, JWT keys
#
# Deploy / update:
#   docker compose -f docker-compose.deploy.yml --env-file .env.deploy up -d --build
#
# Assumes both repos are cloned as siblings:
#   /your-dir/certificate-tracking-backend/   ← you are here
#   /your-dir/certificate-tracking/           ← frontend
#
# Ports exposed to the internet:
#   :3003 → Next.js frontend — proxy this with your existing nginx (see below)
#   :9000 → MinIO S3 (needed so presigned file URLs work in browser)
#   :9001 → MinIO console (optional — close this port in firewall if not needed)
#
# Add to your existing nginx (e.g. /etc/nginx/sites-available/elicense):
#
#   server {
#       listen 80;
#       server_name your-domain-or-ip;
#       client_max_body_size 20m;
#       location / {
#           proxy_pass         http://127.0.0.1:3003;
#           proxy_http_version 1.1;
#           proxy_set_header   Upgrade $http_upgrade;
#           proxy_set_header   Connection 'upgrade';
#           proxy_set_header   Host $host;
#           proxy_set_header   X-Real-IP $remote_addr;
#           proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
#           proxy_set_header   X-Forwarded-Proto $scheme;
#       }
#   }
# =================================================================

services:

  # ── PostgreSQL ─────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: elicense-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: elicense
      POSTGRES_USER: elicense
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elicense"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - elicense

  # ── MinIO (file storage) ───────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: elicense-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"   # S3 API — browser follows presigned URLs here
      - "9001:9001"   # MinIO web console (close in firewall if not needed)
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - elicense

  # ── NestJS API ─────────────────────────────────────────────────
  api:
    build:
      context: .
      target: production
    container_name: elicense-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      # Allow the entrypoint to seed the DB on first boot (only runs when empty)
      ALLOW_SEED: "true"
      # PROTOTYPE: accept TOTP code 000000 (no authenticator app needed). Remove for real prod.
      TOTP_BYPASS: "true"
      DATABASE_URL: postgresql://elicense:${DB_PASSWORD}@db:5432/elicense?schema=public
      JWT_PRIVATE_KEY_BASE64: ${JWT_PRIVATE_KEY_BASE64}
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64}
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_DAYS: 7
      # CORS — allow requests from the public-facing domain
      APP_ORIGIN: http://${SERVER_HOST}
      ADMIN_ORIGIN: http://${SERVER_HOST}
      # MinIO: internal endpoint for upload/delete; public endpoint for presigned URLs
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://${SERVER_HOST}:9000
      MINIO_REGION: us-east-1
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: elicense-private
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - elicense

  # ── Next.js frontend (with BFF proxy) ─────────────────────────
  frontend:
    build:
      context: ../certificate-tracking
      args:
        # Only public build-time vars go here (baked into JS bundle)
        NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN:-}
    container_name: elicense-frontend
    restart: unless-stopped
    ports:
      - "3005:3003"   # proxied by nginx-proxy-manager → http://127.0.0.1:3005
    environment:
      NODE_ENV: production
      PORT: 3003
      # PROTOTYPE: site is served over plain HTTP (no TLS), so auth cookies must
      # NOT be marked Secure or the browser drops them → every authed call 401s.
      # Set to "true" (or remove) once the site is behind HTTPS.
      COOKIE_SECURE: "false"
      # Server-side only — never exposed to the browser
      BACKEND_INTERNAL_URL: http://api:3001
    depends_on:
      - api
    networks:
      - elicense

volumes:
  pgdata:
  miniodata:

networks:
  elicense:
    driver: bridge
