# Prototype production stack.
#
# This is intentionally the same shape as the verified local production-like
# stack, but named for prototype production/demo deployment. It uses the current
# backend `.env` and frontend `../../Frontend/certificate-tracking/.env`; no
# `.env.app` or `.env.local` is required.
#
# Run from this backend directory:
#   sh scripts/production-stack.sh up
#
# Notes:
# - This is for prototype demos, not hardened public production.
# - Backend runtime uses NODE_ENV=development so seed data can run and HTTP
#   cookies work without HTTPS.
# - Docker images are still production builds.
# - Seed runs only when `system_users` is empty. Existing data is not wiped
#   unless you run `sh scripts/production-stack.sh reset`.

name: certificate-tracking-production

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: elicense
      POSTGRES_USER: elicense
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend .env}
    ports:
      - "${PRODUCTION_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elicense -d elicense"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - production_pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-elicense}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in backend .env}
    ports:
      - "${PRODUCTION_MINIO_PORT:-9000}:9000"
      - "${PRODUCTION_MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - production_minio_data:/data

  backend:
    build:
      context: .
      target: production
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://elicense:${DB_PASSWORD:?Set DB_PASSWORD in backend .env}@db:5432/elicense?schema=public
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend .env}
      APP_ORIGIN: http://localhost:${PRODUCTION_FRONTEND_PORT:-3003}
      ADMIN_ORIGIN: http://localhost:${PRODUCTION_FRONTEND_PORT:-3003}
      PUBLIC_API_BASE_URL: http://localhost:${PRODUCTION_BACKEND_PORT:-3001}/api
      # Internal Docker network name for upload/delete.
      MINIO_ENDPOINT: http://minio:9000
      # Browser-facing host for presigned evidence URLs. MUST be reachable from
      # client devices (not localhost on a remote Ubuntu host). Set in backend .env:
      #   MINIO_PUBLIC_ENDPOINT=http://<server-ip-or-dns>:${PRODUCTION_MINIO_PORT}
      # Default keeps local prototype behavior.
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:${PRODUCTION_MINIO_PORT:-9000}}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-elicense}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in backend .env}
      TOTP_BYPASS: "true"
      DEMO_DATA_ENABLED: ${DEMO_DATA_ENABLED:-true}
    ports:
      - "${PRODUCTION_BACKEND_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3001/docs-json'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  frontend:
    build:
      context: ../certificate-tracking
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_DGA_REDIRECT_URI: ${NEXT_PUBLIC_DGA_REDIRECT_URI:-}
        NEXT_PUBLIC_DGA_AUTH_FLOW: ${NEXT_PUBLIC_DGA_AUTH_FLOW:-mtoken}
        NEXT_PUBLIC_DGA_SDK_ENV: ${NEXT_PUBLIC_DGA_SDK_ENV:-uat}
        NEXT_PUBLIC_MTOKEN_DEBUG: ${NEXT_PUBLIC_MTOKEN_DEBUG:-false}
        NEXT_PUBLIC_DGA_NATIVE_DEBUG: ${NEXT_PUBLIC_DGA_NATIVE_DEBUG:-false}
        NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN:?Set NEXT_PUBLIC_MAPBOX_TOKEN in frontend .env}
      dockerfile_inline: |
        FROM oven/bun:1 AS deps
        WORKDIR /app
        COPY package.json bun.lock ./
        RUN bun install --frozen-lockfile

        # Bun 1.3 can crash while Next/Turbopack collects page data on some
        # Linux hosts. Keep Bun for bun.lock installation, but build with the
        # stable Node 22 runtime that also serves the standalone output.
        FROM node:22-bookworm-slim AS builder
        WORKDIR /app
        ARG NEXT_PUBLIC_API_URL
        ARG NEXT_PUBLIC_DGA_REDIRECT_URI
        ARG NEXT_PUBLIC_DGA_AUTH_FLOW
        ARG NEXT_PUBLIC_DGA_SDK_ENV
        ARG NEXT_PUBLIC_MTOKEN_DEBUG
        ARG NEXT_PUBLIC_DGA_NATIVE_DEBUG
        ARG NEXT_PUBLIC_MAPBOX_TOKEN
        ENV NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL
        ENV NEXT_PUBLIC_DGA_REDIRECT_URI=$NEXT_PUBLIC_DGA_REDIRECT_URI
        ENV NEXT_PUBLIC_DGA_AUTH_FLOW=$NEXT_PUBLIC_DGA_AUTH_FLOW
        ENV NEXT_PUBLIC_DGA_SDK_ENV=$NEXT_PUBLIC_DGA_SDK_ENV
        ENV NEXT_PUBLIC_MTOKEN_DEBUG=$NEXT_PUBLIC_MTOKEN_DEBUG
        ENV NEXT_PUBLIC_DGA_NATIVE_DEBUG=$NEXT_PUBLIC_DGA_NATIVE_DEBUG
        ENV NEXT_PUBLIC_MAPBOX_TOKEN=$NEXT_PUBLIC_MAPBOX_TOKEN
        ENV NEXT_TELEMETRY_DISABLED=1
        COPY --from=deps /app/node_modules ./node_modules
        COPY . .
        RUN node ./node_modules/next/dist/bin/next build

        FROM node:22-bookworm-slim AS runner
        WORKDIR /app
        ENV NODE_ENV=production
        ENV NEXT_TELEMETRY_DISABLED=1
        ENV PORT=3003
        ENV HOSTNAME=0.0.0.0
        RUN groupadd --system --gid 1001 nodejs \
          && useradd --system --uid 1001 --gid nodejs nextjs
        COPY --from=builder --chown=nextjs:nodejs /app/public ./public
        COPY --from=builder --chown=nextjs:nodejs /app/.next/standalone ./
        COPY --from=builder --chown=nextjs:nodejs /app/.next/static ./.next/static
        USER nextjs
        EXPOSE 3003
        CMD ["node", "server.js"]
    restart: unless-stopped
    env_file:
      - ../certificate-tracking/.env
    environment:
      NODE_ENV: production
      PORT: 3003
      HOSTNAME: 0.0.0.0
      BACKEND_INTERNAL_URL: http://backend:3001
      COOKIE_SECURE: "false"
      NEXT_PUBLIC_API_URL: http://localhost:${PRODUCTION_FRONTEND_PORT:-3003}
    ports:
      - "${PRODUCTION_FRONTEND_PORT:-3003}:3003"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3003'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s

volumes:
  production_pgdata: {}
  production_minio_data: {}
