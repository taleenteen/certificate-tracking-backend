# Local production-like stack for proving Docker builds, migrations, seed data,
# MinIO uploads, and the Next.js BFF flow on one machine.
#
# Run from this backend directory:
#   sh scripts/local-prod-stack.sh up
#
# This uses the existing backend `.env` and frontend `../../Frontend/certificate-tracking/.env`.
# It intentionally runs the backend with NODE_ENV=development so seed data and
# HTTP cookies work on localhost, while still building production Docker images.

name: certificate-tracking-local-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: elicense
      POSTGRES_USER: elicense
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend .env}
    ports:
      - "${LOCAL_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elicense -d elicense"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - local_prod_pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-elicense}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in backend .env}
    ports:
      - "${LOCAL_MINIO_PORT:-9000}:9000"
      - "${LOCAL_MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - local_prod_minio_data:/data

  backend:
    build:
      context: .
      target: production
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://elicense:${DB_PASSWORD:?Set DB_PASSWORD in backend .env}@db:5432/elicense?schema=public
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend .env}
      APP_ORIGIN: http://localhost:${LOCAL_FRONTEND_PORT:-3003}
      ADMIN_ORIGIN: http://localhost:${LOCAL_FRONTEND_PORT:-3003}
      PUBLIC_API_BASE_URL: http://localhost:${LOCAL_BACKEND_PORT:-3001}/api
      DGA_OIDC_MODE: mock
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:${LOCAL_MINIO_PORT:-9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-elicense}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in backend .env}
      TOTP_BYPASS: "true"
    ports:
      - "${LOCAL_BACKEND_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3001/docs-json').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  frontend:
    build:
      context: ../../Frontend/certificate-tracking
      dockerfile_inline: |
        FROM oven/bun:1 AS deps
        WORKDIR /app
        COPY package.json bun.lock ./
        RUN bun install --frozen-lockfile

        FROM deps AS builder
        WORKDIR /app
        ENV NEXT_TELEMETRY_DISABLED=1
        COPY . .
        RUN bun run build

        FROM node:22-bookworm-slim AS runner
        WORKDIR /app
        ENV NODE_ENV=production
        ENV NEXT_TELEMETRY_DISABLED=1
        ENV PORT=3003
        ENV HOSTNAME=0.0.0.0
        RUN groupadd --system --gid 1001 nodejs \
          && useradd --system --uid 1001 --gid nodejs nextjs
        COPY --from=builder --chown=nextjs:nodejs /app/public ./public
        COPY --from=builder --chown=nextjs:nodejs /app/.next/standalone ./
        COPY --from=builder --chown=nextjs:nodejs /app/.next/static ./.next/static
        USER nextjs
        EXPOSE 3003
        CMD ["node", "server.js"]
    restart: unless-stopped
    env_file:
      - ../../Frontend/certificate-tracking/.env
    environment:
      NODE_ENV: production
      PORT: 3003
      HOSTNAME: 0.0.0.0
      BACKEND_INTERNAL_URL: http://backend:3001
      COOKIE_SECURE: "false"
      NEXT_PUBLIC_API_URL: http://localhost:${LOCAL_FRONTEND_PORT:-3003}
      NEXT_PUBLIC_DGA_REDIRECT_URI: http://localhost:${LOCAL_FRONTEND_PORT:-3003}/auth/login-callback
    ports:
      - "${LOCAL_FRONTEND_PORT:-3003}:3003"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3003').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s

volumes:
  local_prod_pgdata: {}
  local_prod_minio_data: {}
